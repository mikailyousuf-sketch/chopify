<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chopify</title><style>
*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f7f7f8;font:15px Inter,ui-sans-serif,system-ui;min-height:100vh}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 25% 20%,#7c3aed35,transparent 28%),radial-gradient(circle at 80% 10%,#06b6d425,transparent 24%),radial-gradient(circle at 55% 85%,#ec489920,transparent 25%);filter:blur(20px);z-index:-1}
.shell{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.brand{font-weight:850;font-size:22px;letter-spacing:-.7px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#a78bfa;box-shadow:0 0 18px #a78bfa;margin-right:9px}
.badge{border:1px solid #ffffff18;background:#ffffff08;padding:8px 12px;border-radius:999px;color:#d7d7df}
.hero{text-align:center;max-width:790px;margin:0 auto 35px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.95;letter-spacing:-4px;margin:0 0 18px}.hero p{color:#a7a7b1;font-size:18px}
.card{background:#111217cc;border:1px solid #ffffff16;box-shadow:0 30px 90px #0008;backdrop-filter:blur(18px);border-radius:24px;padding:22px}
.source{display:flex;gap:10px}.source input,.brief,select{background:#08090d;border:1px solid #ffffff18;color:white;border-radius:14px;outline:none}.source input{width:100%;padding:18px;font-size:16px}.brief{width:100%;min-height:100px;padding:15px;margin-top:12px;resize:vertical}
.row{display:flex;gap:10px;align-items:center;margin-top:12px;flex-wrap:wrap}.row select{padding:12px}.check{color:#bbb;display:flex;gap:7px;align-items:center}
button{border:0;border-radius:14px;padding:15px 22px;font-weight:750;cursor:pointer}.primary{margin-left:auto;background:white;color:#09090b}.primary:hover{transform:translateY(-1px)}
.status{margin:24px 0;display:none}.bar{height:4px;background:#ffffff12;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:35%;background:white;animation:go 1.4s infinite ease-in-out}@keyframes go{from{transform:translateX(-110%)}to{transform:translateX(330%)}}
.head{display:flex;justify-content:space-between;align-items:end;margin:36px 0 14px}.head h2{font-size:30px;letter-spacing:-1px;margin:0}.muted{color:#8c8c98}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:13px}.clip{position:relative;background:#101116;border:1px solid #ffffff13;border-radius:18px;padding:17px;cursor:pointer}.clip.on{border-color:#a78bfa;box-shadow:0 0 0 1px #a78bfa55}.score{font-size:30px;font-weight:850}.type{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#a78bfa}.hook{font-size:17px;font-weight:700;margin:12px 0 8px}.why{color:#999aa5;font-size:13px;line-height:1.45}.tick{position:absolute;right:14px;top:14px}
.actions{position:sticky;bottom:18px;margin-top:20px;display:none;justify-content:space-between;align-items:center;background:#17181ee8;border:1px solid #ffffff1a;padding:13px 15px;border-radius:18px;backdrop-filter:blur(15px)}
.log{display:none;white-space:pre-wrap;background:#050506;border:1px solid #ffffff10;color:#8d8e99;padding:12px;border-radius:12px;max-height:180px;overflow:auto;font:11px monospace;margin-top:12px}
@media(max-width:650px){.shell{padding:20px}.hero h1{letter-spacing:-2px}.source{display:block}.source button{width:100%;margin-top:8px}.primary{width:100%;margin:0}.top{margin-bottom:38px}}
</style></head><body><main class="shell"><div class="top"><div class="brand"><span class="dot"></span>CHOPIFY</div><div class="badge">Creator Rewards · V1</div></div>
<section class="hero"><h1>Long video.<br>Best moments.</h1><p>Paste a link or drop in a local video path. Chopify finds, judges and packages the clips worth posting.</p></section>
<section class="card"><div class="source"><input id="source" placeholder="Paste YouTube/video URL or local file path…"><button onclick="pickLocal()">Choose file</button><input id="file" type="file" accept="video/*" hidden></div>
<textarea id="campaign" class="brief" placeholder="Campaign brief (optional) — e.g. Find chaotic, funny, controversial moments with complete context and payoff."></textarea>
<div class="row"><select id="count"><option>10</option><option>20</option><option selected>45</option></select><span class="muted">max clips</span><label class="check"><input id="original" type="checkbox"> Original mode</label><button class="primary" onclick="analyze()">Generate clips →</button></div>
<div id="status" class="status"><div class="row"><b id="stage">Working…</b><span class="muted" id="err"></span></div><div class="bar"><i></i></div><pre id="log" class="log"></pre></div></section>
<div class="head"><div><h2>Your clips</h2><div class="muted" id="summary">Analyze a video to begin.</div></div></div><section id="grid" class="grid"></section>
<div id="actions" class="actions"><b id="selected">0 selected</b><div class="row" style="margin:0"><select id="style"><option>default</option><option>hormozi</option><option>mrbeast</option><option>podcast</option></select><label class="check"><input id="loud" type="checkbox" checked> normalize audio</label><button onclick="render()">Render selected →</button></div></div></main>
<script>
let chosen=new Set(),busy=false;
function pickLocal(){document.getElementById('file').click()} file.onchange=()=>{if(file.files[0])source.value=file.files[0].path||file.files[0].name}
async function post(url,data){return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})}
async function analyze(){if(!source.value.trim())return alert('Paste a link or local video path first.');chosen.clear();await post('/api/analyze',{source:source.value,campaign:campaign.value,max_clips:+count.value,original:original.checked,model:'openrouter/free'});poll()}
async function render(){if(!chosen.size)return;await post('/api/render',{ids:[...chosen],style:style.value,loudnorm:loud.checked});poll()}
async function poll(){status.style.display='block';let s=await fetch('/api/status').then(r=>r.json());stage.textContent=s.stage;err.textContent=s.error||'';log.textContent=(s.log||[]).slice(-30).join('\n');if(s.running){busy=true;setTimeout(poll,1200)}else{if(busy){busy=false;loadClips()} }}
async function loadClips(){let clips=await fetch('/api/clips').then(r=>r.json());grid.innerHTML='';summary.textContent=clips.length?clips.length+' ranked candidates · click to select':'No analyzed clips yet.';clips.forEach(c=>{let d=document.createElement('article');d.className='clip'+(chosen.has(c.id)?' on':'');d.onclick=()=>{chosen.has(c.id)?chosen.delete(c.id):chosen.add(c.id);loadClips()};d.innerHTML='<input class="tick" type="checkbox" '+(chosen.has(c.id)?'checked':'')+'><div class="type">'+esc(c.viral_type||'moment')+'</div><div class="score">'+(+c.overall||0).toFixed(1)+'</div><div class="hook">'+esc(c.hook||'Untitled clip')+'</div><div class="why">'+esc(c.judge_reason||c.why||'')+'</div>';grid.appendChild(d)});selected.textContent=chosen.size+' selected';actions.style.display=clips.length?'flex':'none'}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}loadClips();poll();
</script></body></html>
